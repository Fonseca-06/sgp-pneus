<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGP Pneus</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<header class="topo">
  <div class="marca">SGP <span>Pneus</span></div>
  <nav class="abas">
    <button class="aba ativa" data-tab="produtos">Produtos</button>
    <button class="aba" data-tab="clientes">Clientes</button>
    <button class="aba" data-tab="pedidos">Pedidos</button>
    <button class="aba" data-tab="config">Configurações</button>
  </nav>
</header>

<main>

<!-- ══════════ PRODUTOS ══════════ -->
<section id="tab-produtos" class="tela">
  <div class="busca-hero">
    <input id="busca-medida" type="search" placeholder="Buscar por medida — ex: 175/70 R13, 185 60 15..." autocomplete="off">
    <div class="acoes">
      <button class="btn" id="btn-novo-produto">+ Novo produto</button>
      <button class="btn primario" id="btn-importar">Importar CSV</button>
    </div>
  </div>
  <div id="resultado-busca"></div>
</section>

<!-- ══════════ CLIENTES ══════════ -->
<section id="tab-clientes" class="tela oculta">
  <div class="busca-hero">
    <input id="busca-cliente" type="search" placeholder="Buscar cliente por nome, CPF/CNPJ ou telefone (mín. 3 caracteres)..." autocomplete="off">
    <div class="acoes">
      <button class="btn primario" id="btn-novo-cliente">+ Novo cliente</button>
    </div>
  </div>
  <div id="resultado-clientes"></div>
</section>

<!-- ══════════ PEDIDOS ══════════ -->
<section id="tab-pedidos" class="tela oculta">
  <div class="placeholder">Módulo de Pedidos — próxima etapa.</div>
</section>

<!-- ══════════ CONFIGURAÇÕES ══════════ -->
<section id="tab-config" class="tela oculta">
  <div class="card">
    <h2>Fornecedores</h2>
    <form id="form-fornecedor" class="linha-form">
      <input id="forn-nome" placeholder="Nome do fornecedor" required>
      <input id="forn-contato" placeholder="Contato (opcional)">
      <button class="btn primario">Adicionar</button>
    </form>
    <div id="lista-fornecedores"></div>
  </div>
  <div class="card">
    <h2>Importações realizadas</h2>
    <div id="lista-importacoes"></div>
  </div>
</section>

</main>

<!-- ══════════ MODAL PRODUTO ══════════ -->
<div id="modal-produto" class="modal-fundo oculta">
  <div class="modal">
    <h2 id="modal-produto-titulo">Novo produto</h2>
    <form id="form-produto">
      <input type="hidden" id="prod-id">
      <div class="grade-form">
        <label>Fornecedor
          <select id="prod-fornecedor" required></select>
        </label>
        <label>Medida
          <input id="prod-medida" placeholder="175/70 R13" required>
        </label>
        <label>Marca
          <input id="prod-marca" required>
        </label>
        <label>Modelo
          <input id="prod-modelo" required>
        </label>
        <label>Índice de carga
          <input id="prod-carga" placeholder="82">
        </label>
        <label>Índice de velocidade
          <input id="prod-veloc" placeholder="T">
        </label>
        <label>Custo (R$)
          <input id="prod-custo" inputmode="decimal" required>
        </label>
        <label>Preço de venda (R$)
          <input id="prod-venda" inputmode="decimal" required>
        </label>
      </div>
      <div class="modal-acoes">
        <button type="button" class="btn" id="btn-cancelar-produto">Cancelar</button>
        <button type="submit" class="btn primario">Salvar</button>
      </div>
    </form>
  </div>
</div>

<!-- ══════════ MODAL CLIENTE ══════════ -->
<div id="modal-cliente" class="modal-fundo oculta">
  <div class="modal larga">
    <h2 id="modal-cliente-titulo">Novo cliente</h2>
    <form id="form-cliente">
      <input type="hidden" id="cli-id">
      <div class="tipo-toggle">
        <label><input type="radio" name="cli-tipo" value="PF" checked> Pessoa Física</label>
        <label><input type="radio" name="cli-tipo" value="PJ"> Pessoa Jurídica</label>
      </div>
      <div class="grade-form">
        <label class="col2" id="rotulo-nome">Nome completo
          <input id="cli-nome" required>
        </label>
        <label class="so-pj col2">Nome fantasia
          <input id="cli-fantasia">
        </label>
        <label id="rotulo-doc">CPF
          <input id="cli-documento" required inputmode="numeric">
        </label>
        <label class="so-pf">Data de nascimento
          <input id="cli-nascimento" type="date">
        </label>
        <label class="so-pj">Data de abertura
          <input id="cli-abertura" type="date">
        </label>
        <label class="so-pj">Inscrição estadual
          <input id="cli-ie">
        </label>
        <label class="so-pj">Inscrição municipal
          <input id="cli-im">
        </label>
        <label>Telefone
          <input id="cli-telefone" inputmode="tel">
        </label>
        <label>Celular
          <input id="cli-celular" inputmode="tel">
        </label>
        <label class="col2">E-mail
          <input id="cli-email" type="email">
        </label>
        <label>CEP
          <input id="cli-cep" inputmode="numeric">
        </label>
        <label class="col2">Endereço
          <input id="cli-logradouro">
        </label>
        <label>Número
          <input id="cli-numero">
        </label>
        <label>Complemento
          <input id="cli-complemento">
        </label>
        <label>Bairro
          <input id="cli-bairro">
        </label>
        <label>Cidade
          <input id="cli-cidade">
        </label>
        <label>Estado (UF)
          <input id="cli-uf" maxlength="2">
        </label>
        <label class="so-pf">País
          <input id="cli-pais" value="Brasil">
        </label>
        <div class="so-pj col2 flags-pj">
          <label><input type="checkbox" id="cli-consumidor-final"> Consumidor final</label>
          <label><input type="checkbox" id="cli-revenda"> Revenda</label>
          <label><input type="checkbox" id="cli-industria"> É indústria</label>
          <label><input type="checkbox" id="cli-simples"> Optante Simples Nacional</label>
        </div>
        <label class="col2">Vendedor responsável
          <input id="cli-vendedor">
        </label>
        <label class="so-pj col2">Referências comerciais
          <input id="cli-referencias">
        </label>
        <label class="so-pj col2">Parecer do vendedor
          <input id="cli-parecer">
        </label>
        <label class="col2">Observações
          <input id="cli-observacao">
        </label>
      </div>
      <div class="modal-acoes">
        <button type="button" class="btn" id="btn-cancelar-cliente">Cancelar</button>
        <button type="submit" class="btn primario">Salvar</button>
      </div>
    </form>
  </div>
</div>

<!-- ══════════ MODAL FICHA DO CLIENTE ══════════ -->
<div id="modal-ficha" class="modal-fundo oculta">
  <div class="modal larga">
    <div id="ficha-conteudo"></div>
  </div>
</div>

<!-- ══════════ MODAL IMPORTAÇÃO ══════════ -->
<div id="modal-importar" class="modal-fundo oculta">
  <div class="modal larga">
    <h2>Importar tabela de preços</h2>

    <div id="imp-passo1">
      <div class="grade-form">
        <label>Fornecedor
          <select id="imp-fornecedor" required></select>
        </label>
        <label>Arquivo CSV
          <input type="file" id="imp-arquivo" accept=".csv,.txt">
        </label>
      </div>
      <p class="dica">Colunas reconhecidas no cabeçalho: <code>medida</code>, <code>marca</code>, <code>modelo</code>, <code>custo</code> (ou <code>preco</code>), <code>preco_venda</code>, <code>indice_carga</code>, <code>indice_veloc</code>. Separador , ou ; detectado automaticamente.</p>
      <div class="modal-acoes">
        <button type="button" class="btn" data-fechar-imp>Cancelar</button>
        <button type="button" class="btn primario" id="btn-analisar">Analisar arquivo</button>
      </div>
    </div>

    <div id="imp-passo2" class="oculta">
      <div id="imp-resumo"></div>
      <div id="imp-rejeitados"></div>
      <div class="modal-acoes">
        <button type="button" class="btn" data-fechar-imp>Cancelar</button>
        <button type="button" class="btn primario" id="btn-confirmar-imp">Confirmar importação</button>
      </div>
    </div>

    <div id="imp-passo3" class="oculta">
      <div id="imp-resultado"></div>
      <div class="modal-acoes">
        <button type="button" class="btn primario" data-fechar-imp>Fechar</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="oculta"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2/dist/umd/supabase.min.js"></script>
<script src="app.js?v=2"></script>
</body>
</html>
